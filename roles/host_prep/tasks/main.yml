---
# 01 - Base host preparation

- name: "[01.1.1] Assert supported OS family"
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "Only Debian/Ubuntu targets are supported."

- name: "[01.1.2] Update apt cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "[01.1.3] Install base packages"
  ansible.builtin.apt:
    name: "{{ host_prep_packages }}"
    state: present

- name: "[01.2.1] Set timezone"
  community.general.timezone:
    name: "{{ host_prep_timezone }}"

- name: "[01.3.1] Create application base directory"
  ansible.builtin.file:
    path: "{{ host_prep_app_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
